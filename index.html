<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>Guitar Flash - Con Grabador Integrado</title>
  <style>
    * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background: #000;
      background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Interfaz Superior --- */
    header {
      height: 10vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.5);
      border-bottom: 1px solid #333;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      color: #ff0;
      text-shadow: 0 0 5px #ff0;
    }

    #marcador {
      font-size: 14px;
      color: #aaa;
    }

    #puntos {
      color: #fff;
      font-weight: bold;
      font-size: 16px;
    }

    #combo {
      color: #0ff;
      font-size: 18px;
      margin-left: 10px;
      opacity: 0;
    }

    /* --- Botón Inicio --- */
    #contenedor-inicio {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    #btn-inicio {
      background: linear-gradient(180deg, #28a745 0%, #1e7e34 100%);
      color: white;
      border: 2px solid #fff;
      padding: 20px 40px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(40, 167, 69, 0.5);
    }

    audio {
      display: none;
    }

    /* --- Área de Juego (Pista) --- */
    .juego-container {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .pista-contenedor {
      perspective: 300px;
      width: 100%;
      max-width: 400px;
      height: 100%;
      position: relative;
    }

    #pista {
      width: 100%;
      height: 120%;
      background: linear-gradient(180deg, #111 0%, #222 100%);
      border-left: 4px solid #444;
      border-right: 4px solid #444;
      transform: rotateX(45deg);
      transform-origin: bottom center;
      position: absolute;
      bottom: 0;
    }

    .carril {
      width: 25%;
      height: 100%;
      float: left;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .carril:last-child {
      border-right: none;
    }

    /* Línea de Meta (Blanca) */
    #linea-meta {
      position: absolute;
      bottom: 15%;
      width: 100%;
      height: 8px;
      background: #fff;
      box-shadow: 0 0 15px #fff, 0 0 5px #fff;
      z-index: 5;
    }

    /* --- Notas --- */
    .nota {
      width: 90%;
      height: 20px;
      border-radius: 5px;
      position: absolute;
      left: 5%;
      z-index: 10;
      transform: translateY(-50%);
      box-shadow: 0 0 10px currentColor;
    }

    /* Nota Larga (Cuerpo) */
    .nota-larga-cuerpo {
      width: 90%;
      position: absolute;
      left: 5%;
      z-index: 9;
      opacity: 0.7;
      transform-origin: top center;
      border-radius: 5px;
    }

    /* Colores */
    .verdes {
      background: #0f0;
      color: #0f0;
      border: 2px solid #fff;
    }

    .rojas {
      background: #f00;
      color: #f00;
      border: 2px solid #fff;
    }

    .amarillas {
      background: #ff0;
      color: #ff0;
      border: 2px solid #fff;
    }

    .azules {
      background: #0cf;
      color: #0cf;
      border: 2px solid #fff;
    }

    .nota-larga-cuerpo.verdes {
      background: linear-gradient(to bottom, #0f0, #040);
    }

    .nota-larga-cuerpo.rojas {
      background: linear-gradient(to bottom, #f00, #400);
    }

    .nota-larga-cuerpo.amarillas {
      background: linear-gradient(to bottom, #ff0, #440);
    }

    .nota-larga-cuerpo.azules {
      background: linear-gradient(to bottom, #0cf, #034);
    }

    /* Efecto Hit */
    @keyframes hit-glow {
      0% {
        opacity: 1;
        transform: scale(1) translateY(-50%);
      }

      100% {
        opacity: 0;
        transform: scale(1.5) translateY(-50%);
      }
    }

    .nota-hit {
      animation: hit-glow 0.2s ease-out forwards;
    }

    /* --- Botones / Teclas (Área Táctil) --- */
    .teclas-guia {
      height: 15vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 400px;
      padding: 10px;
      background: #000;
      border-top: 1px solid #333;
      z-index: 10;
    }

    .tecla {
      flex: 1;
      height: 100%;
      max-height: 70px;
      border: 3px solid #fff;
      border-radius: 15px;
      font-weight: bold;
      font-size: 24px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.05s;
    }

    .tecla::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      background: currentColor;
      opacity: 0.2;
    }

    .tecla.presionada {
      transform: scale(0.9);
    }

    .tecla.presionada::after {
      opacity: 0.5;
    }

    /* Estilos específicos teclas */
    .t-v {
      border-color: #0f0;
      color: #0f0;
    }

    .t-r {
      border-color: #f00;
      color: #f00;
    }

    .t-a {
      border-color: #ff0;
      color: #ff0;
    }

    .t-z {
      border-color: #0cf;
      color: #0cf;
    }

    .tecla.presionada.t-v {
      background-color: #0f0;
      color: #000;
    }

    .tecla.presionada.t-r {
      background-color: #f00;
      color: #000;
    }

      background-color: #ff0;
      color: #000;
    }

    .tecla.presionada.t-z {
      background-color: #0cf;
      color: #000;
    }
  </style>

    mapaCancion.sort((a, b) => a.tiempo - b.tiempo);

    // ==========================================================
    // === GRABADOR CORREGIDO ===
    // ==========================================================
    const notasGrabadas = [];

    window.addEventListener('keydown', (e) => {
      if (e.repeat || audio.paused) return;
      const tecla = e.key.toLowerCase();
      const carril = mapeoTeclas[tecla];

      if (carril !== undefined) {
        // El momento en que presionas ES el momento exacto de impacto en lalínea blanca
        const msMetaTarget = Math.round(audio.currentTime * 1000);

        const m = Math.floor(msMetaTarget / 60000);
        const s = Math.floor((msMetaTarget % 60000) / 1000);
        const ms = msMetaTarget % 1000;

        const textoNota = `{ tiempo: min(${m}, ${s}, ${ms}), carril: ${carril} },`;

        notasGrabadas.push(textoNota);
        console.log(textoNota);
      }
    });

    audio.addEventListener('ended', () => {
      console.log("\n================ MAPA GENERADO (COPIAR Y PEGAR) ================\n");
      console.log("const mapaCancion = [\n  " + notasGrabadas.join("\n  ") + "\n];");
      console.log("\n===============================================================");
    });
    // ==========================================================
    // ==========================================================

    // --- INICIALIZACIÓN ---
    function recalcularMedidas() {
      altoPista = pistaEl.offsetHeight;
      Y_META = metaEl.offsetTop + (metaEl.offsetHeight / 2);
      Y_START = -100;
    }

    window.addEventListener('resize', recalcularMedidas);
    recalcularMedidas();

    // --- BUCLE DE JUEGO ---
    function bucleJuego() {
      if (!isPlaying || audio.paused) {
        requestAnimationFrame(bucleJuego);
        return;
      }

      const tiempoAudioMs = audio.currentTime * 1000;

      while (siguienteNotaIndex < mapaCancion.length) {
        const info = mapaCancion[siguienteNotaIndex];
        if (tiempoAudioMs >= info.tiempo - TIEMPO_VUELO) {
          crearNotaVisual(info);
          siguienteNotaIndex++;
        } else {
          break;
        }
      }

      for (let i = notasActivas.length - 1; i >= 0; i--) {
        const nota = notasActivas[i];
        const msDesdeNacimiento = tiempoAudioMs - (nota.tiempoTarget - TIEMPO_VUELO);
        const fraccionVuelo = msDesdeNacimiento / TIEMPO_VUELO;
        const distanciaTotal = Y_META - Y_START;
        const actualY = Y_START + (distanciaTotal * fraccionVuelo);

        nota.elemento.style.top = `${actualY}px`;

        if (nota.isLarga && nota.cuerpoElemento) {
          nota.cuerpoElemento.style.top = `${actualY}px`;
          const altoCuerpoPx = distanciaTotal * (nota.duracion / TIEMPO_VUELO);

          if (!nota.estaSiendoSostenida) {
            nota.cuerpoElemento.style.height = `${altoCuerpoPx}px`;
            nota.cuerpoElemento.style.transform = `scaleY(-1)`;
          } else {
            const msRestantesLarga = (nota.tiempoTarget + nota.duracion) - tiempoAudioMs;
            const fraccionRestante = msRestantesLarga / nota.duracion;
            nota.cuerpoElemento.style.height = `${altoCuerpoPx * fraccionRestante}px`;
            nota.cuerpoElemento.style.top = `${Y_META}px`;
            nota.cuerpoElemento.style.transform = `scaleY(-1)`;

            actualizarPuntos(1);

            if (tiempoAudioMs >= nota.tiempoTarget + nota.duracion) {
              eliminarNota(i);
              continue;
            }
          }
        }

        const limiteFallo = nota.isLarga ? (nota.tiempoTarget + nota.duracion) : nota.tiempoTarget;

        if (tiempoAudioMs > limiteFallo + VENTANA_HIT) {
          if (nota.isLarga && nota.estaSiendoSostenida) {
            registrarFallo();
          } else if (!nota.hitInsideVentana) {
            registrarFallo();
          }
          eliminarNota(i);
        }
      }

      requestAnimationFrame(bucleJuego);
    }

    // --- VISUAL ---
    function crearNotaVisual(info) {
      const carrilEl = document.getElementById(`carril-${info.carril}`);
      const notaEl = document.createElement('div');
      notaEl.className = `nota ${clasesColor[info.carril]}`;
      notaEl.style.top = `${Y_START}px`;
      carrilEl.appendChild(notaEl);

      const nuevaNota = {
        elemento: notaEl,
        carril: info.carril,
        tiempoTarget: info.tiempo,
        duracion: info.duracion || 0,
        isLarga: info.duracion > MIN_DURACION_LARGA,
        cuerpoElemento: null,
        hitInsideVentana: false,
        estaSiendoSostenida: false
      };

      if (nuevaNota.isLarga) {
        const cuerpoEl = document.createElement('div');
        cuerpoEl.className = `nota-larga-cuerpo ${clasesColor[info.carril]}`;
        cuerpoEl.style.top = `${Y_START}px`;
        carrilEl.appendChild(cuerpoEl);
        nuevaNota.cuerpoElemento = cuerpoEl;
      }

      notasActivas.push(nuevaNota);
    }

    function eliminarNota(index) {
      if (notasActivas[index]) {
        notasActivas[index].elemento.remove();
        if (notasActivas[index].cuerpoElemento) notasActivas[index].cuerpoElemento.remove();
        notasActivas.splice(index, 1);
      }
    }

    // --- CONTROLES Y MECÁNICAS ---
    function presionarMecanica(carril) {
      if (!isPlaying) return;
      teclasPresionadas[carril] = true;
      visualizarTecla(carril, true);

      const tiempoActualMs = audio.currentTime * 1000;
      const notasEnCarril = notasActivas
        .filter(n => n.carril === carril && !n.hitInsideVentana)
        .sort((a, b) => Math.abs(a.tiempoTarget - tiempoActualMs) - Math.abs(b.tiempoTarget - tiempoActualMs));

      if (notasEnCarril.length > 0) {
        const nota = notasEnCarril[0];
        const desvio = Math.abs(nota.tiempoTarget - tiempoActualMs);

        if (desvio <= VENTANA_HIT) {
          nota.hitInsideVentana = true;
          if (nota.isLarga) {
            nota.estaSiendoSostenida = true;
            nota.elemento.classList.add('nota-hit');
            actualizarPuntos(50);
          } else {
            actualizarPuntos(100);
            nota.elemento.classList.add('nota-hit');
            setTimeout(() => eliminarNota(notasActivas.indexOf(nota)), 100);
          }
        } else if (tiempoActualMs > nota.tiempoTarget - VENTANA_HIT * 2) {
          registrarFallo();
        }
      }
    }

    function soltarMecanica(carril) {
      teclasPresionadas[carril] = false;
      visualizarTecla(carril, false);

      notasActivas.forEach(nota => {
        if (nota.carril === carril && nota.isLarga && nota.estaSiendoSostenida) {
          nota.estaSiendoSostenida = false;
        }
      });
    }

    function actualizarPuntos(cantidad) {
      puntos += cantidad * (combo > 10 ? 2 : 1);
      puntosEl.innerText = puntos;
      combo++;
      if (combo > 1) {
        comboEl.innerText = `x${combo}`;
        comboEl.style.opacity = 1;
      }
    }

    function registrarFallo() {
      combo = 0;
      comboEl.style.opacity = 0;
      pistaEl.style.borderColor = '#f00';
      setTimeout(() => pistaEl.style.borderColor = '#444', 100);
    }

    // --- LISTENERS ---
    document.querySelectorAll('.tecla').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); e.stopPropagation();
        const carril = parseInt(btn.getAttribute('data-carril'));
        presionarMecanica(carril);
      });

      window.addEventListener('pointerup', (e) => {
        const carril = parseInt(btn.getAttribute('data-carril'));
        if (teclasPresionadas[carril]) soltarMecanica(carril);
      });
      window.addEventListener('pointercancel', (e) => {
        const carril = parseInt(btn.getAttribute('data-carril'));
        if (teclasPresionadas[carril]) soltarMecanica(carril);
      });
    });

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const tecla = e.key.toLowerCase();
      if (mapeoTeclas[tecla] !== undefined) {
        presionarMecanica(mapeoTeclas[tecla]);
      }
    });

    window.addEventListener('keyup', (e) => {
      const tecla = e.key.toLowerCase();
      if (mapeoTeclas[tecla] !== undefined) {
        soltarMecanica(mapeoTeclas[tecla]);
      }
    });

    function visualizarTecla(carril, presionada) {
      const btn = document.getElementById(`btn-${carril}`);
      if (presionada) btn.classList.add('presionada');
      else btn.classList.remove('presionada');
    }

    // --- CONTROL DE INICIO ---
    const contenedorInicio = document.getElementById('contenedor-inicio');
    document.getElementById('btn-inicio').addEventListener('click', () => {
      recalcularMedidas();
      contenedorInicio.style.display = 'none';
      isPlaying = true;
      audio.play().catch(e => alert("Error al reproducir audio"));
      bucleJuego();
    });
  </script>
